<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HJ.cutlet</title>
    <link rel="stylesheet" href="./style.css" />

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>

  <body>
    <!-- 상단 움직이는 텍스트 -->
    <div class="marquee">
      <div class="track" id="marqueeTrack">
        <div class="marquee-group" id="marqueeGroupA">
          <span class="marquee-item">
            본 사이트는 호정의 생일을 기념하여 제작된 비공식 튀김 시설입니다.
            &nbsp; • &nbsp; 튀김기를 클릭하면 노릇노릇한 호까스가 투입됩니다.
            &nbsp; • &nbsp; さあ、揚げましょう！ &nbsp; • &nbsp; 호까스를
            클릭하면 재도약의 기회가 주어집니다. &nbsp; • &nbsp; 튀김기를 Zoom
            in, Turn around! &nbsp; • &nbsp;
          </span>
        </div>

        <div class="marquee-group" id="marqueeGroupB" aria-hidden="true"></div>
      </div>
    </div>

    <!-- Three.js 화면 -->
    <canvas id="webgl"></canvas>

    <!-- 튀김 소리 -->
    <audio id="fryingSound" src="zigle_sound.mp3" preload="auto" loop></audio>

    <!-- 생일 편지 팝업 버튼 -->
    <button
      id="soundButton"
      class="sound-button"
      aria-label="생일 편지 열기"
      type="button"
    >
      <img src="./image/pigB.png" alt="생일 편지 열기" />
    </button>

    <!-- 마퀴 반복 설정 -->
    <script>
      const groupA = document.querySelector('#marqueeGroupA');
      const groupB = document.querySelector('#marqueeGroupB');

      const originalContent = groupA.innerHTML;

      function setupMarquee() {
        groupA.innerHTML = originalContent;

        const firstItem = groupA.firstElementChild;
        const itemWidth = firstItem.getBoundingClientRect().width;

        if (!itemWidth) return;

        const copies = Math.ceil((window.innerWidth * 1.5) / itemWidth);

        for (let i = 1; i < copies; i++) {
          groupA.appendChild(firstItem.cloneNode(true));
        }

        groupB.innerHTML = groupA.innerHTML;
      }

      setupMarquee();

      window.addEventListener('resize', setupMarquee);
    </script>

    <!-- main.js는 한 번만 호출 -->
    <script type="module" src="./main.js"></script>
  </body>
</html>
